name: Continuous Integration

on:
    push:
        branches:
            - main
    pull_request:
    workflow_dispatch:

permissions:
    contents: write

jobs:
    ci:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
              with:
                  install: true
                  cache: true
                  experimental: true
            - name: Run tests
              run: mise run test
            - name: Run lint
              run: mise run lint
            - name: Run ua-update
              run: mise run ua-update
